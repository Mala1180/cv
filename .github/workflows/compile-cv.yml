name: Compile CV

on:
  push:
    branches: [ main ]
    paths-ignore:
      - .gitattributes
      - .gitignore
      - action.yml
      - LICENSE
      - '**.md'
      - LICENSE
      - .github/**
      - '!.github/workflows/test.yml'
  pull_request:
    paths-ignore:
      - .gitattributes
      - .gitignore
      - action.yml
      - LICENSE
      - '**.md'
      - .github/**
      - '!.github/workflows/test.yml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Compile Typst Files
      uses: ammar-ahmed22/compile-typst-action@v1
      with:
        source_paths: 'cv.typ'
        output_paths: 'cv.pdf'
        fonts_path: 'fonts'

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: cv
        path: cv.pdf

    - name: Release
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        files: cv.pdf
