name: Compile CV

on:
  push:
    branches: [ main ]
    paths-ignore:
      - .gitattributes
      - .gitignore
      - action.yml
      - LICENSE
      - '**.md'
      - LICENSE
      - .github/**
      - '!.github/workflows/compile.yml'
  pull_request:
    paths-ignore:
      - .gitattributes
      - .gitignore
      - action.yml
      - LICENSE
      - '**.md'
      - .github/**
      - '!.github/workflows/compile.yml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Typst
      uses: typst-community/setup-typst@v3
    
    - name: Compile CV
      run: typst compile cv.typ
    
    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: cv-pdf
        path: cv.pdf

    - name: Generate timestamp
      id: ts
      run: echo "tag=cv-$(date +'%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.ts.outputs.tag }}
        name: "CV - ${{ steps.ts.outputs.tag }}"
        files: cv.pdf